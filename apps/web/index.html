<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DomainTrail</title>
    <!-- the logo's 16px drawing (assets/brand/favicon-16-optical.svg), indigo on a light OS theme, light indigo on a dark one -->
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="stylesheet" href="./styles.css" />
    <script>
      // Apply the theme before the app loads so that the page does not flash light (see apps/web/theme.ts),
      try {
        const pref = JSON.parse(localStorage.getItem('domaintrail.theme') ?? '"auto"');
        const dark = pref === 'dark' || (pref !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      } catch {
        document.documentElement.dataset.theme = 'light';
      }
      // and the text size (see apps/web/app/text-size.ts), so that the panes open at their size
      try {
        const scales = { small: 0.9, large: 1.15, xlarge: 1.3 };
        const scale = scales[JSON.parse(localStorage.getItem('domaintrail.textSize') ?? '"standard"')];
        if (typeof scale === 'number') document.documentElement.style.fontSize = `${Math.round(scale * 1000) / 10}%`;
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
