[test]
# the unit tests next to the code (packages/*/src, web) and the integration tests in test/ (CONTRIBUTING.md, Tests);
# examples/shop runs its own tests (contract and application) itself (test/contract-tests.test.ts)
pathIgnorePatterns = ["examples/**", "dist/**", "tree-sitter-domaintrail/**", "editors/**"]

[install]
# install only versions published at least 3 days ago, matching the cooldown of Dependabot (.github/dependabot.yml)
minimumReleaseAge = 259200
# each workspace package (packages/*, web) resolves only the dependencies its own package.json declares (ADR 0025)
linker = "isolated"
