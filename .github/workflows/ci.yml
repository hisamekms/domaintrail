name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun run typecheck

      # the shop's code imports its generated contracts, which the type-aware lint needs
      - run: node dist/dt.js -r examples/shop generate ts
      - run: bun run lint

      # TODO: remove continue-on-error with the repository-wide formatting commit (`bun run fmt`)
      - run: bun run fmt:check
        continue-on-error: true

      # also generates, type-checks and runs examples/shop's contract tests, application tests and demo, and checks
      # that the tree-sitter build stamp is fresh
      - run: bun test

      - name: Check examples/shop on Node
        run: |
          node dist/dt.js -r examples/shop check
          node dist/dt.js -r examples/shop fmt --check
