name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read
  id-token: write # npm trusted publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # staged publishing needs npm 11.15.0 or later
      - run: npm install -g npm@latest

      - name: Check that the tag matches package.json
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"

      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun run typecheck
      - run: node dist/dt.js -r examples/shop generate ts
      - run: bun run lint
      # TODO: remove continue-on-error with the repository-wide formatting commit (`bun run fmt`)
      - run: bun run fmt:check
        continue-on-error: true
      - run: bun test

      - name: Smoke test on Node
        run: node dist/dt.js -r examples/shop check

      # staged: approve on npmjs.com (Staged Packages) or with `npm stage approve <id>`
      - run: npm stage publish --access public

      - name: Remind to approve the staged version
        run: |
          {
            echo "## ⏳ Approve ${GITHUB_REF_NAME} to publish it"
            echo
            echo "domaintrail ${GITHUB_REF_NAME} is staged on npm and is **not public until approved**."
            echo "Approve it in the package's Staged Packages tab on npmjs.com, or run:"
            echo
            echo '```'
            echo 'npm stage list domaintrail'
            echo 'npm stage approve <stage-id>'
            echo '```'
            echo
            echo "See docs/releasing.md."
          } >> "$GITHUB_STEP_SUMMARY"
