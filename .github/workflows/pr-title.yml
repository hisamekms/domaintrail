name: PR title

# squash merging makes the title of a pull request its commit on main, so the title follows Conventional Commits
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions: {}

jobs:
  pr-title:
    runs-on: ubuntu-latest
    steps:
      - env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|docs|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9-]+\))?!?: [^A-Z[:space:]]'
          if [[ ! "$TITLE" =~ $pattern ]]; then
            echo "::error::The title must follow Conventional Commits (see CONTRIBUTING.md): $TITLE"
            exit 1
          fi
