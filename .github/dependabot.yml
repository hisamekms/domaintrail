version: 2
updates:
  - package-ecosystem: bun
    # the root is enough for the workspace (ADR 0025): Dependabot reads the workspaces of the root package.json
    # (packages/*, web) and merges a dependency declared in several of them into one, so its pull request should update
    # every manifest and bun.lock together; test/architecture.test.ts fails when their versions differ
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    commit-message:
      prefix: chore
      include: scope
    ignore:
      # Langium 4.4 needs vscode-languageserver ~10.1: a newer major gives the language server a second, incompatible
      # LSP stack (#9). Bump it together with a Langium release that depends on it (eclipse-langium/langium#2249).
      - dependency-name: vscode-languageserver
        update-types: ['version-update:semver-major']
  - package-ecosystem: cargo
    directory: /editors/zed
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    commit-message:
      prefix: chore
      include: scope
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    commit-message:
      prefix: ci
      include: scope
